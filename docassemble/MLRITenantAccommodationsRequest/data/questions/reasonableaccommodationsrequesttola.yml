---
id: ReasonableAccommodationsRequesttoLandlord
continue button field: reasonableaccommodationsrequesttola_intro
question: |
  Tenant accommodations request letter
subquestion: |
  This interview helps you write a letter to your landlord to request a reasonable accommodation related to a disability.
  
  You can use this interview if you or someone in your household has a disability and you need a change to rules, policies, or services in your housing.
  
  Before you get started:
  
  1. Gather the name and address of your landlord or property manager.
  2. Decide how you will deliver the letter (tenant portal, email, or mail).
  
  When you are finished, you will need to download the completed letter and either:
    
  1. Upload the signed letter to your tenant portal, 
  2. Attach the letter to an email to your landlord or property management company, or
  3. Print and mail the letter to your landlord or property management company. 


  Most people take about 7 minutes to complete this interview.
---
id: Confirm Purpose
question: |
  Do you or someone in your household have a disability and need a housing accommodation?
fields:
  - no label: disability_exists
    datatype: yesnoradio
terms:
  tenant: |
    A tenant is a person who rents their home.
---
id: No Disability Offramp
event: no_disability
question: | 
  This form is only for tenants who need a disability-related housing accommodation. 
  
  If that does not fit your situation, you can exit now.
buttons: 
  - Exit: exit
---
id: Use Information
question: |
  Are you requesting accommodations for yourself or for a member of your household?
fields:
  - Accommodations are for: request_subject
    input type: radio
    choices:
      - me: me
      - a member of my household: household_member
---
code: |
  if request_subject == "me":
    subject_ref = "I am"
  else:
    subject_ref = "a member of my household is"
---
id: Accommodation requests
question: |
  What types of accommodations do you need?
fields:
  - "Assistance animal": is_animal
    datatype: yesno
    help: |
      This includes service animals and emotional support animals.
  - "Reserved parking space": is_parking
    datatype: yesno
  - "Change rent due date to a day after my public benefits come in": is_rent
    datatype: yesno
  - "Something else": is_custom
    datatype: yesno
validation code: |
  if not (is_animal or is_parking or is_rent or is_custom):
    validation_error("Select at least one accommodation.")
---
code: |
  animal_body = "I am requesting permission for an assistance animal to assist with daily living. I understand that our building's rules state a no-pet policy. However, I am requesting that you make a reasonable accommodation in the building's rules to permit an assistance animal in my apartment."
---
code: |
  parking_body = "I am requesting a reserved parking space closest to my unit. I understand parking is on a first come, first served basis, but due to my limited mobility, I am requesting a reserved parking space closest to my unit."
---
code: |
  rent_body = f"I am requesting to pay my rent on the { ordinal(duedate_request) } day of the month without being assessed a late fee. I receive my public benefits on the { ordinal(paydate) } day of the month."
---
code: |
  request_body = ""
  if is_animal:
    request_body += animal_body + "\n\n"
  if is_parking:
    request_body += parking_body + "\n\n"
  if is_rent:
    request_body += rent_body + "\n\n"
  if is_custom:
    request_body += custom_body + "\n\n"
---
id: Fixed income date
question: On which day of the month do you receive a disability check or other fixed income?
fields: 
  - "Enter day of the month as a number": paydate
    datatype: integer
    min: 1
    max: 31
---
id: Request rent deadline change details
question: Which day of the month do you want rent to be due?
fields: 
  - "Enter day of the month as a number": duedate_request
    datatype: integer
    min: 1
    max: 31
---
id: Custom request details
question: Accommodation request
subquestion: |
  Describe the change you want in your own words.
fields:
  - "The change I want is": custom_change
    input type: area
    help: |
      Example: permission to install a doorbell with a strobe.
      You can include more than one request.
  - "The reason I need the change is": custom_justification
    input type: area
    help: |
      Example: I need this because my child cannot hear the doorbell due to a disability.
      Write a complete sentence.
---
id: custom preview
continue button field: custom_preview
question: |
  Preview your accommodation request
subquestion: |
  Here is a preview of the accommodation request you entered: 
  
  ${ custom_body }

  Is this correct?  If yes, click Next. If no, click Undo and edit your request.
back button: True
---
code: |
  custom_body = f"I am requesting { custom_change }. { custom_justification }"
---
code: |
  signature_fields = ['users[0].signature']
---
id: preview request letter
question: |
  Preview your form before you sign it
subquestion: |
  Here is a preview of the form you will sign on the next page.   
  
  ${ al_recipient_bundle.as_pdf(key='preview') }

  Click the image to open it in a new tab. Click the "Edit answers" button
  to edit your answers.

  ${ action_button_html(url_action('review_reasonableaccommodationsrequesttola'), label='Edit answers', color='info') }
  
  Remember to come back to this window to continue and sign your form.
continue button field: reasonableaccommodationsrequesttola_preview_question    
---
id: request letter review screen
event: review_reasonableaccommodationsrequesttola
question: |
  Review your answers
review:
  - Edit: users.revisit
    button: |
      **Users**

      % for item in users:
        * ${ item }
      % endfor
  - Edit: landlords.revisit
    button: |
      **Landlords**

      % for item in landlords:
        * ${ item }
      % endfor
  - Edit: request_subject
    button: |
      **Accommodations recipient**:
      ${ request_subject }
---
continue button field: users.revisit
question: |
  Edit users
subquestion: |
  ${ users.table }

  ${ users.add_action() }
---
table: users.table
rows: users
columns:
  - Phone number: |
      row_item.phone_number if defined("row_item.phone_number") else ""
  - Signature: |
      row_item.signature if defined("row_item.signature") else ""
  - Name: |
